:root{
  --bg:#07060f;--bg2:#120d1c;--ink:#f3e2b8;--mut:#a8916a;
  --amb:#e8ba62;--amb2:#cb9d44;--brn:#7a4900;--brn2:#3d2604;
  --pk1:#8f3134;--pk2:#c66d6f;--pk3:#fca4a5;
  --grn:#7fd37a;--red:#ff5a5a;--blu:#6ab7ff;--cy:#d0ffff;
  --f:clamp(13px,3.6vw,16px);
  --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:"AtariPrzem",monospace;font-size:var(--f);line-height:1.25;text-transform:uppercase;letter-spacing:.02em;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
img,canvas{image-rendering:pixelated;image-rendering:-moz-crisp-edges;image-rendering:crisp-edges;display:block}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}

/* ---------- HUD ---------- */
#hud{flex:none;padding:calc(var(--safeT) + 8px) 12px 8px;background:linear-gradient(#0d0a18,#07060f);border-bottom:2px solid #241a35;z-index:3}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
#where{min-width:0}
#pname{font-size:1.25em;color:var(--pk3);letter-spacing:.12em;white-space:nowrap}
#gname{font-size:.68em;color:var(--pk1);letter-spacing:.1em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#moneyBox{display:flex;align-items:center;gap:6px;padding:6px 10px;border:2px solid #3a2a12;background:#140e05}
#money{font-size:1.15em;color:var(--amb);letter-spacing:.06em;transition:color .3s}
#money.up{color:var(--grn)}#money.down{color:var(--red)}
#menuBtn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:2px solid #3a2a55;color:#9d8bd0;font-size:1.1em;flex:none}
#bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.bar{font-size:.68em;color:var(--mut)}
.bar .lab{margin-bottom:3px;white-space:nowrap;font-size:.92em;letter-spacing:.08em}
.bar .val{margin-top:3px;color:var(--ink);font-size:1.05em;white-space:nowrap}
.bar .trk{height:8px;background:#1c1630;border:1px solid #2f2648;position:relative;overflow:hidden}
.bar .fil{position:absolute;inset:0 auto 0 0;background:var(--amb);transition:width .4s steps(8)}
.bar.fuel .fil{background:#ffb84d}.bar.cargo .fil{background:var(--blu)}.bar.hull .fil{background:var(--grn)}
.bar.hull.warn .fil{background:#ffd34d}.bar.hull.crit .fil{background:var(--red)}

/* ---------- SCENA ---------- */
#scene{flex:none;position:relative;height:clamp(150px,27vh,230px);overflow:hidden;background:radial-gradient(120% 90% at 50% 120%,#2a1440 0%,#0b0818 55%,#05040b 100%)}
#scene.city{background:radial-gradient(120% 90% at 50% 120%,#4a2a10 0%,#170d10 55%,#05040b 100%)}
#scene.forest{background:radial-gradient(120% 90% at 50% 120%,#173a1c 0%,#0b1410 55%,#05040b 100%)}
#scene.alert{animation:alarm .8s steps(2) infinite}
@keyframes alarm{0%{background:radial-gradient(120% 90% at 50% 120%,#6a0d14 0%,#1c0508 60%,#050203 100%)}100%{background:radial-gradient(120% 90% at 50% 120%,#2a0508 0%,#0c0306 60%,#050203 100%)}}
#stars{position:absolute;inset:0;width:100%;height:100%}
#pics{position:absolute;left:0;right:0;top:8px;bottom:32px;display:flex;align-items:flex-end;justify-content:center;gap:14px}
#pics img{flex:none;filter:drop-shadow(0 0 12px rgba(0,0,0,.6))}
#pics img.in{animation:popin .35s steps(4)}
@keyframes popin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#ribbon{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(transparent,rgba(0,0,0,.75) 40%);color:var(--pk2);letter-spacing:.3em;font-size:.95em;white-space:nowrap}

/* ---------- TREŚĆ ---------- */
#main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:12px 12px calc(16px + var(--safeB));background:#0e0a06;
  background-image:linear-gradient(rgba(14,10,6,.86),rgba(14,10,6,.86)),var(--tex);background-size:auto,16px 16px}
.h{color:var(--amb2);font-size:.78em;letter-spacing:.2em;margin:4px 2px 8px}
.card{background:#1c1308;border:2px solid var(--amb2);box-shadow:0 0 0 2px #0e0a06,inset 0 0 0 2px #3a2608;padding:12px;margin-bottom:12px}
.card .txt{line-height:1.45}
.card.talk{display:flex;gap:12px;align-items:center}
.card.talk img{flex:none;border:2px solid var(--brn);background:#000}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-height:132px;padding:10px 8px 10px;
  background:linear-gradient(#24170a,#170f06);border:2px solid var(--brn);box-shadow:inset 0 0 0 2px #0e0a06;text-align:center}
.tile canvas{width:64px;height:64px}
.tile .lb{color:var(--amb);font-size:.95em;line-height:1.2}
.tile .sb{color:var(--mut);font-size:.68em;line-height:1.3}
.tile:active,.btn:active,.row:active{transform:translateY(1px);filter:brightness(1.25)}
.tile.dis{opacity:.42}
.tile.wide{grid-column:span 2;flex-direction:row;justify-content:flex-start;min-height:76px;gap:12px;text-align:left}
.tile.wide .tx{display:flex;flex-direction:column;gap:5px}
.tile.wide canvas{width:48px;height:48px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;width:100%;padding:10px 12px;border:2px solid var(--amb);background:#2a1b08;color:var(--amb);text-align:center;line-height:1.2}
.btn.pri{background:var(--amb);color:#1c1308;border-color:var(--amb)}
.btn.red{border-color:var(--red);color:#ffd0d0;background:#3a0d10}
.btn.red.pri{background:var(--red);color:#1a0505}
.btn.ghost{border-color:#3a2a12;color:var(--mut);background:transparent}
.btn[disabled]{opacity:.4}
.btns{display:flex;flex-direction:column;gap:10px}
.btns.two{display:grid;grid-template-columns:1fr 1fr}
.back{margin-top:4px}

/* rynek */
.goods{margin-bottom:12px;border:2px solid var(--brn);background:#160f06}
.ghd,.row{display:grid;grid-template-columns:1fr 3.3em 3.3em 3.3em;gap:4px;align-items:center;padding:0 10px}
.ghd{min-height:30px;color:var(--mut);font-size:.68em;letter-spacing:.12em;border-bottom:2px solid var(--brn)}
.ghd span:not(:first-child),.row span:not(:first-child){text-align:right}
.row{width:100%;min-height:52px;border-bottom:1px solid #2c1d09}
.row:last-child{border-bottom:0}
.row .nm{display:flex;flex-direction:column;gap:4px}
.row .nm small{font-size:.62em;color:var(--mut)}
.row .bp{color:var(--amb)}.row .sp{color:#e9d3a6}.row .ow{color:var(--blu)}
.row.off .bp,.row.off .sp{color:#5e4a2c}
.lv{display:inline-block;width:6px;height:6px;margin-right:4px;vertical-align:middle;background:#555}
.lv.c{background:var(--grn)}.lv.m{background:#d8c25a}.lv.e{background:var(--red)}
.legend{font-size:.62em;color:var(--mut);display:flex;gap:12px;justify-content:center;margin:-4px 0 12px}

/* statki / dodatki */
.ship{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.ship img{background:#000;border:2px solid var(--brn)}
.ship .nm{color:var(--amb);font-size:1.1em;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
.ship .st{font-size:.7em;color:var(--mut);line-height:1.6}
.ship .st b{font-weight:normal;color:var(--ink)}
.ship .btn{grid-column:span 2;min-height:46px}
.tag{font-size:.62em;padding:3px 6px;border:1px solid var(--grn);color:var(--grn);white-space:nowrap}

/* mapa */
.galaxy .gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.galaxy .gh b{font-weight:normal;color:var(--pk3);letter-spacing:.15em}
.galaxy .gh span{font-size:.62em;color:var(--mut)}
.track{position:relative;height:30px;margin:0 6px 10px}
.track:before{content:"";position:absolute;left:0;right:0;top:14px;height:2px;background:repeating-linear-gradient(90deg,#4a3a70 0 4px,transparent 4px 8px)}
.track i{position:absolute;top:9px;width:12px;height:12px;margin-left:-6px;background:#6b5aa8;border:2px solid #0e0a06}
.track i.here{background:var(--pk3);box-shadow:0 0 0 3px rgba(252,164,165,.35);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.pl{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;width:100%;min-height:52px;padding:8px 10px;border:2px solid #2b2244;background:#120e22;margin-bottom:8px}
.pl .n{color:var(--ink)}.pl .c{font-size:.75em;color:#ffb84d;text-align:right}
.pl .d{font-size:.6em;color:#8f84b8;margin-top:4px}
.pl.here{border-color:var(--pk2);background:#2a1424}.pl.here .c{color:var(--pk3)}
.pl.far .c{color:var(--red)}
.galaxy.lock{opacity:.5}
.lockmsg{font-size:.68em;color:var(--mut);text-align:center;padding:6px}

/* ---------- arkusz ---------- */
#veil{position:fixed;inset:0;z-index:20;background:rgba(3,2,8,.66);opacity:0;pointer-events:none;transition:opacity .18s}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;max-height:86vh;overflow-y:auto;
  background:#1c1308;border-top:3px solid var(--amb);box-shadow:0 -10px 30px rgba(0,0,0,.6);
  padding:10px 14px calc(16px + var(--safeB));transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.9,.3,1)}
#sheet.on{transform:none}
#sheet .grab{width:44px;height:4px;background:#5a4220;margin:2px auto 12px}
#sheet .sh{display:flex;gap:12px;align-items:center;margin-bottom:12px}
#sheet .sh img{flex:none;background:#000;border:2px solid var(--brn)}
#sheet .sh .tt{color:var(--amb);font-size:1.05em;line-height:1.3}
#sheet .sh .st{color:var(--mut);font-size:.72em;margin-top:5px;line-height:1.4}
#sheet .body{line-height:1.5;margin-bottom:14px}
#sheet.alert{border-top-color:var(--red)}
.tabs{display:grid;grid-template-columns:1fr 1fr;margin-bottom:12px;border:2px solid var(--brn)}
.tabs button{min-height:44px;color:var(--mut);text-align:center}
.tabs button.on{background:var(--amb);color:#1c1308}
.qty{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin-bottom:10px}
.qty .v{text-align:center;font-size:1.9em;color:var(--ink);letter-spacing:.06em}
.qty button{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border:2px solid var(--amb);color:var(--amb);font-size:1.3em;background:#2a1b08}
.qty button:active{background:var(--amb);color:#1c1308}
input[type=range]{width:100%;height:36px;margin:2px 0 10px;-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:#3a2608;border:1px solid var(--brn)}
input[type=range]::-moz-range-track{height:8px;background:#3a2608;border:1px solid var(--brn)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;background:var(--amb);border:3px solid #1c1308;box-shadow:0 0 0 2px var(--amb)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;background:var(--amb);border:3px solid #1c1308;border-radius:0}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.quick button{text-align:center;min-height:42px;border:2px solid #4a3410;color:var(--mut);font-size:.8em}
.quick button:active{border-color:var(--amb);color:var(--amb)}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:.78em;color:var(--mut);margin-bottom:14px;padding:10px;border:1px dashed #4a3410}
.sum b{font-weight:normal;color:var(--ink);text-align:right}
.sum b.neg{color:var(--red)}.sum b.pos{color:var(--grn)}
.note{font-size:.7em;color:var(--mut);line-height:1.5;margin-bottom:12px}

/* ---------- ekrany pełne ---------- */
.full{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:calc(var(--safeT) + 20px) 18px calc(var(--safeB) + 20px);
  background:radial-gradient(120% 80% at 50% 100%,#1b2d5a 0%,#07060f 65%);text-align:center;overflow-y:auto}
.full.hide{display:none}
.full canvas.bgst{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
#logo{width:min(92vw,460px);height:auto}
.arrows{color:var(--amb2);letter-spacing:.08em;font-size:.9em;white-space:nowrap}
.credit{color:var(--cy);line-height:1.6;font-size:.85em;opacity:.85}
.full .btns{width:min(340px,88vw)}
.blurb{max-width:360px;color:#9fb6da;font-size:.72em;line-height:1.7}
.endimg{display:flex;gap:0;justify-content:center}
.big{font-size:1.4em;color:var(--pk3);letter-spacing:.12em;line-height:1.4}

#toast{position:fixed;left:50%;top:calc(var(--safeT) + 86px);z-index:40;transform:translate(-50%,-20px);opacity:0;pointer-events:none;
  background:#140e05;border:2px solid var(--amb);color:var(--amb);padding:10px 14px;transition:all .25s;white-space:nowrap;font-size:.85em}
#toast.on{opacity:1;transform:translate(-50%,0)}
#ovm{position:fixed;inset:0;z-index:35;background:rgba(3,2,8,.72);display:flex;align-items:center;justify-content:center;padding:18px}
#ovm.hide{display:none}
#ovm .card{width:min(360px,100%)}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hrow">
      <div id="where"><div id="pname">—</div><div id="gname"></div></div>
      <div class="hrow" style="gap:8px">
        <div id="moneyBox"><canvas id="icoCoin" width="8" height="8" style="width:14px;height:14px"></canvas><span id="money">0</span></div>
        <button id="menuBtn" aria-label="Menu">≡</button>
      </div>
    </div>
    <div id="bars">

// dane: 32×64 (piksel trybu 4 = 2 piksele hires) → 64×64 z podwojeniem w poziomie
function picURL(code){
  const pk=colorMode==='orig'?'orig':(PIC_PAL[code]||'orig'),key=code+':'+pk;
  if(PIC_CACHE[key])return PIC_CACHE[key];
  const i=PIC_IDX[code],cols=[null,...PALS[pk].map(rgb)];
  const c=document.createElement('canvas');c.width=64;c.height=64;
  const x=c.getContext('2d'),id=x.createImageData(64,64);
  for(let p=0;p<32*64;p++){
    const v=(PICDATA[i*512+(p>>2)]>>(6-2*(p&3)))&3;if(!v)continue;
    const col=cols[v],px=p%32,py=(p/32)|0;
    for(const dx of [0,1]){const o=(py*64+px*2+dx)*4;id.data[o]=col[0];id.data[o+1]=col[1];id.data[o+2]=col[2];id.data[o+3]=255}
  }
  x.putImageData(id,0,0);return PIC_CACHE[key]=c.toDataURL();
}

let _sr=987654;const srnd=()=>(_sr=(_sr*1103515245+12345)&0x7fffffff)/0x7fffffff;
function starfield(canvas){
  const st={warp:0,stars:[]};let W=0,H=0;const x=canvas.getContext('2d');
  function resize(){const r=canvas.getBoundingClientRect();W=canvas.width=Math.max(1,Math.round(r.width/2));H=canvas.height=Math.max(1,Math.round(r.height/2))}
  for(let i=0;i<90;i++)st.stars.push({x:srnd(),y:srnd(),z:srnd()*.9+.1});
  function frame(){
    if(canvas.offsetParent!==null||canvas.closest('.full:not(.hide)')){
      if(canvas.width!==Math.round(canvas.getBoundingClientRect().width/2))resize();
      x.clearRect(0,0,W,H);
      const sp=st.warp?0.02+st.warp*0.05:0.0006;
      for(const s of st.stars){
        s.x-=sp*s.z;if(s.x<0){s.x+=1;s.y=srnd()}
        const px=(s.x*W)|0,py=(s.y*H)|0,b=s.z>.7?'#fff':s.z>.4?'#9aa3d6':'#4b4f80';
        x.fillStyle=b;
        if(st.warp){x.fillRect(px,py,Math.max(1,(st.warp*30*s.z)|0),1)}else x.fillRect(px,py,1,1);
      }
    }
    requestAnimationFrame(frame);
  }
  resize();addEventListener('resize',resize);requestAnimationFrame(frame);return st;
}

try{muted=localStorage.getItem('przemytnik-mute')==='1'}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='square',v=.1,f2){if(muted)return;const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0005,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d+.02)}
function noise(d,v=.16,f=180){if(muted)return;const a=ac();if(!a)return;const n=(a.sampleRate*d)|0,buf=a.createBuffer(1,n,a.sampleRate),dt=buf.getChannelData(0);let s=12345,val=0,step=Math.max(1,(a.sampleRate/f)|0);for(let i=0;i<n;i++){if(i%step===0){s=(s*1103515245+12345)&0x7fffffff;val=s/0x3fffffff-1}dt[i]=val}const src=a.createBufferSource(),g=a.createGain();src.buffer=buf;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.0005,a.currentTime+d);src.connect(g).connect(a.destination);src.start()}
const SND={tap(){tone(1420,.09,'square',.06)},ok(){tone(880,.07,'square',.07);setTimeout(()=>tone(1320,.09,'square',.07),70)},
  no(){tone(220,.18,'square',.09)},coin(){tone(1900,.05,'square',.05);setTimeout(()=>tone(2500,.08,'square',.05),50)},
  warp(){tone(120,1.1,'sawtooth',.05,900)},alarm(){[0,1,2].forEach(i=>setTimeout(()=>tone(880,.16,'square',.08,440),i*220))},
  boom(){noise(.6,.25,90)},win(){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'square',.08),i*150))}};
function vib(ms){try{if(!muted&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}}

  $('pname').textContent=PLANETS[S.planet-1][0];
  $('gname').textContent='UKŁAD '+GAL[galOf(S.planet)].n+' • '+S.shipName;

let sceneP=[];

function tiles(items,parent=main){
  return new Promise(res=>{
    const g=h('div',{cls:'tiles'});
    items.forEach((it,i)=>{
      const pic=it.icon?icon(it.icon,it.color||'#e8ba62'):(it.img!=null?img(it.img,'',it.wide?48:72):null);
      const t=h('button',{cls:'tile'+(it.wide?' wide':'')+(it.dis?' dis':'')},pic,
        it.wide?h('div',{cls:'tx'},h('div',{cls:'lb'},it.label),it.sub?h('div',{cls:'sb'},it.sub):null)
               :h('div',{cls:'lb'},it.label),(!it.wide&&it.sub)?h('div',{cls:'sb'},it.sub):null);
      t.addEventListener('click',()=>{
        if(it.dis){SND.no();vib(30);if(it.why)toast(it.why,2400);return}
        SND.tap();vib(10);g.querySelectorAll('button').forEach(b=>b.disabled=true);res(i)});
      g.append(t);
    });
    parent.append(g);
  });
}

/* ---- arkusz (bottom sheet) ---- */
let sheetOpen=false;
function openSheet(build,{alert=false}={}){
  return new Promise(res=>{
    const sh=$('sheet'),veil=$('veil');sh.innerHTML='';sh.className=alert?'alert':'';
    sh.append(h('div',{cls:'grab'}));
    let done=false;
    const close=v=>{if(done)return;done=true;sh.classList.remove('on');veil.classList.remove('on');sheetOpen=false;setTimeout(()=>res(v),180)};
    build(sh,close);
    requestAnimationFrame(()=>{sh.classList.add('on');veil.classList.add('on')});sheetOpen=true;sh.scrollTop=0;
    veil.onclick=()=>close(null);
  });
}
function sheetHead(sh,{img:ic=null,title='',sub=''}){
  const d=h('div',{cls:'sh'});if(ic!=null)d.append(img(ic,'',64));
  d.append(h('div',{},h('div',{cls:'tt'},title),sub?h('div',{cls:'st'},sub):null));sh.append(d);

}

// wybór ilości
function qtySheet({title,sub='',ic=null,price,max,mode='buy',info}){
  return openSheet((sh,close)=>{
    sheetHead(sh,{img:ic,title,sub});
    let q=max;if(max<=0)q=0;
    const v=h('div',{cls:'v'},'0');
    const minus=h('button',{},'-'),plus=h('button',{},'+');
    const rng=h('input',{type:'range',min:'0',max:String(Math.max(0,max)),step:'1',value:String(q)});
    const sum=h('div',{cls:'sum'});
    const upd=()=>{v.textContent=q;rng.value=q;sum.innerHTML=info(q);okb.disabled=q===0};
    const set=n=>{n=Math.max(0,Math.min(max,n|0));if(n!==q){q=n;SND.tap();upd()}};
    const rep=(btn,d)=>{let t,iv;const stop=()=>{clearTimeout(t);clearInterval(iv)};btn.addEventListener('pointerdown',e=>{e.preventDefault();set(q+d);t=setTimeout(()=>{iv=setInterval(()=>set(q+d*Math.max(1,Math.ceil(max/60))),70)},350)});['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop))};
    rep(minus,-1);rep(plus,1);
    rng.addEventListener('input',()=>{q=+rng.value;upd()});
    sh.append(h('div',{cls:'qty'},minus,v,plus),rng);
    const qk=h('div',{cls:'quick'});
    [['0',0],['25%',.25],['50%',.5],['MAX',1]].forEach(([l,f])=>{const b=h('button',{},l);b.onclick=()=>set(Math.round(max*f));qk.append(b)});
    sh.append(qk,sum);
    const okb=h('button',{cls:'btn pri'},mode==='sell'?'SPRZEDAJ':mode==='fuel'?'TANKUJ':mode==='repair'?'NAPRAW':'KUP');
    okb.onclick=()=>{SND.coin();vib(15);close(q)};
    const cancel=h('button',{cls:'btn ghost'},'ANULUJ');cancel.onclick=()=>close(0);
    sh.append(h('div',{cls:'btns two'},cancel,okb));
    upd();
  }).then(v=>v||0);
}

/* ================= LOGIKA ================= */
function recalcPrices(){for(let i=1;i<=10;i++){const e=BASE[i-1]+S.market[S.planet][i]*FACT[i-1]+rnd()*FACT[i-1];S.buy[i]=INT(e+SPREAD[i-1]);S.sell[i]=INT(e-SPREAD[i-1])}}
function driftMarket(){for(let b=1;b<=12;b++)for(let f=1;f<=10;f++){const d=INT(rnd()*4)*S.trend[b][f];S.market[b][f]+=d;
  if(S.market[b][f]<0){S.market[b][f]=-S.market[b][f];S.trend[b][f]=1}
  if(S.market[b][f]>16){S.market[b][f]=16-(S.market[b][f]-16);S.trend[b][f]=-1}}}
const owned=k=>S.upg[k]===0;
const fuelCost=d=>Math.abs(POS[d-1]-POS[S.planet-1])*(S.ship+1)*5;
const cargoTotal=()=>S.cargo.reduce((a,b)=>a+b,0);

/* ---------- ORBITA ---------- */
async function sOrbit(){
  S.scene='orbit';save();hud();
  setScene('ORBITA',[8,9]);page();
  main.append(h('div',{cls:'h'},'NA ORBICIE PLANETY '+PLANETS[S.planet-1][0]));
  const c=await tiles([
    {img:9,label:'ODLOT',sub:'MAPA GWIEZDNA'},
    {icon:'fuel',color:'#ffb84d',label:'TANKOWANIE',sub:S.fuelPrice+' ZA 1 SJP'},
    {img:7,label:'DO LASU',sub:'CZARNY RYNEK',dis:S.place===1,why:'HANDLUJĄCEGO W MIEŚCIE W LESIE NIE PRZYJMĄ'},
    {img:6,label:'DO MIASTA',sub:'BIURO, TAWERNA, PORT',dis:S.place===2,why:'HANDLUJĄCEGO W LESIE W MIEŚCIE NIE PRZYJMĄ'}]);
  if(c===0)return 'map';
  if(c===2)return 'forest';
  if(c===3)return 'city';
  await refuel();return 'orbit';
}
async function refuel(){
  const max=Math.min(1000-S.fuel,INT(S.money/S.fuelPrice));
  if(S.fuel>=1000){await say('ZBIORNIK JEST PEŁNY.',{title:'TANKOWANIE'});return}
  if(S.money<S.fuelPrice){await wonBiedaku();return}
  const q=await qtySheet({title:'TANKOWANIE',sub:`PALIWO KOSZTUJE TUTAJ ${S.fuelPrice} ZA JEDNOSTKĘ SJP`,price:S.fuelPrice,max,mode:'fuel',
    info:q=>`<span>KOSZT</span><b class="neg">-${q*S.fuelPrice}</b><span>PALIWO PO</span><b>${S.fuel+q} / 1000</b><span>ZOSTANIE CI</span><b>${S.money-q*S.fuelPrice}</b>`});
  if(!q)return;
  S.money-=q*S.fuelPrice;S.fuel+=q;hud();toast(`ZATANKOWANO ${q} SJP`);
}

/* ---------- MAPA / ODLOT ---------- */
async function sMap(){
  setScene('MAPA GWIEZDNA',[139,9]);page();
  const maxGal=S.ship===0?0:Math.min(S.ship,3);
  return new Promise(res=>{
    main.append(h('div',{cls:'h'},'WYBIERZ CEL • KOSZT W SJP'));
    GAL.forEach((g,gi)=>{
      const lock=gi>maxGal;
      const c=h('div',{cls:'card galaxy'+(lock?' lock':'')});
      c.append(h('div',{cls:'gh'},h('b',{},g.n),h('span',{},lock?'ZAMKNIĘTY':'PLANETY '+(g.to-g.from+1))));
      const tr=h('div',{cls:'track'});const lo=POS[g.from-1],hi=POS[g.to-1];
      for(let p=g.from;p<=g.to;p++){const i=h('i',{cls:p===S.planet?'here':''});i.style.left=(hi===lo?50:(POS[p-1]-lo)/(hi-lo)*100)+'%';tr.append(i)}
      c.append(tr);
      if(lock){c.append(h('div',{cls:'lockmsg'},'POTRZEBUJESZ STATKU '+SHIPS[gi][0]+' LUB LEPSZEGO'))}
      else for(let p=g.from;p<=g.to;p++){
        const here=p===S.planet,cost=fuelCost(p),far=!here&&cost>S.fuel;
        const b=h('button',{cls:'pl'+(here?' here':'')+(far?' far':'')},
          h('div',{},h('div',{cls:'n'},PLANETS[p-1][0]),h('div',{cls:'d'},here?'TU JESTEŚ':'ODLEGŁOŚĆ '+Math.abs(POS[p-1]-POS[S.planet-1])+' PC')),
          h('div',{cls:'c'},here?'◆':cost+' SJP'));
        b.onclick=async()=>{
          SND.tap();
          if(here){toast('PRZECIEŻ TU JESTEŚ');return}
          if(far){
            const k=await ask(`NIE MASZ TYLE PALIWA. POTRZEBUJESZ ${cost} SJP, MASZ ${S.fuel}.`,[{label:'ZATANKUJ',cls:'pri'},{label:'ZAMKNIJ',cls:'ghost'}],{title:'ZA MAŁO PALIWA',alert:true});
            if(k===0){await refuel();res('map')}return;
          }
          const k=await ask(null,[{label:'LECIEĆ NA '+PLANETS[p-1][1],cls:'pri'},{label:'CZY NIE LECIEĆ ?',cls:'ghost'}],
            {img:139,title:PLANETS[p-1][0]+' • '+GAL[galOf(p)].n,sub:`KOSZT ${cost} SJP • ZOSTANIE ${S.fuel-cost} SJP`});
          if(k===0){S._dest=p;res('flight')}
        };
        c.append(b);
      }
      main.append(c);
    });
    buttonRow([{label:'WRÓĆ NA ORBITĘ',cls:'ghost',icon:'back'}]).then(()=>res('orbit'));
  });
}

/* ---------- LOT ---------- */
async function sFlight(){
  const dest=S._dest;delete S._dest;
  S.fuel-=fuelCost(dest);S.tav=0;S.place=0;
  const P=S.planet;if(P>10)S.shipsAvail=4;if(P<11)S.shipsAvail=3;if(P<9)S.shipsAvail=2;if(P<6)S.shipsAvail=1;
  S.repair=(INT(rnd()*4)+12)*(S.ship+1);S.fuelPrice=6+INT(rnd()*9);
  S.planet=dest;S.day++;
  driftMarket();
  // animacja skoku
  page();setScene('W DRODZE NA '+PLANETS[dest-1][0],[9]);hud();
  $('pname').textContent='>>> '+PLANETS[dest-1][0];
  SND.warp();for(let i=1;i<=10;i++){STARS.warp=Math.min(1,i/5);await sleep(60)}await sleep(500);
  for(let i=10;i>=0;i--){STARS.warp=i/10;await sleep(40)}STARS.warp=0;hud();
  let ev=null;
  if(INT(rnd()*7)<100/S.cond)ev='police';else if(INT(rnd()*7)<100/S.cond)ev='meteor';else if(INT(rnd()*7)<100/S.cond)ev='pirates';
  if(ev){const r=await EVENTS[ev]();if(r)return r}
  recalcPrices();hud();save();
  toast('PRZYLOT: '+PLANETS[S.planet-1][0]);
  return 'orbit';
}
function damage(max){const d=INT(rnd()*max);S.cond-=d;hud();return d}
function escapeMax(){let v=38;for(let k=1;k<=4;k++)v=5-5*(owned(k)?1:0);return v} // tak liczy oryginał: liczą się tylko EKRANY
function wreckText(){return `STATEK ZNISZCZONY W ${S.cond<1?100:100-S.cond} PROCENTACH.`}
async function escapeHit(pic){
  setScene('UCIECZKA',[pic],'alert');SND.boom();vib(150);
  damage(escapeMax());
  await say('UCIEKŁEŚ, ALE OBERWAŁO CI SIĘ. '+wreckText(),{title:'UCIECZKA',img:pic});
  return S.cond<1?'wreck':null;
}
// konfiskata/grabież: oddajesz część towaru, miejsce w ładowni wraca
function loseGoods(frac){
  let lost=0;
  for(let i=1;i<=10;i++){const v=INT(S.cargo[i]*frac);S.cargo[i]-=v;S.free+=v*UNITS[i-1];lost+=v}
  hud();return lost;
}
const EVENTS={
  async police(){
    setScene('ALARM',[134],'alert');page();SND.alarm();vib([80,60,80]);
    card('OJ, NIEDOBRZE. SPOSTRZEGŁ CIĘ PATROL KOSMICZNEJ POLICJI.',{img:134});
    const c=await buttonRow([{label:'UCIEKASZ',cls:'red pri'},{label:'PODDAJESZ SIĘ',cls:''}]);
    if(c===0)return await escapeHit(134);
    const n=loseGoods(.1);
    await say(`POLICJA KONFISKUJE CI 10 PROC. TOWARÓW.${n?' ZABRALI '+n+' SZT.':''}`,{title:'KONTROLA',img:134});
    return null;
  },
  async meteor(){
    setScene('ALARM',[5],'alert');page();SND.boom();vib(250);
    card('OJ, NIEDOBRZE. WPADŁEŚ W RÓJ METEORYTÓW.',{img:5});
    await sleep(700);
    let v=30;for(let k=1;k<=4;k++)v=5-5*(owned(k)?1:0);
    damage(v);
    await say('DOSZŁO DO KOLIZJI. '+wreckText(),{title:'METEORYTY',img:5,alert:true});
    return S.cond<1?'wreck':null;
  },
  async pirates(){
    setScene('ALARM',[135],'alert');page();SND.alarm();vib([80,60,80]);
    let n=0;for(let k=1;k<=4;k++)if(owned(k))n++;
    let str=2;if(n)str=4+n;if(n>2)str=5+n;
    card('OJ, NIEDOBRZE. ATAKUJE CIEBIE STATEK KOSMICZNYCH PIRATÓW.',{img:135});
    main.append(h('div',{cls:'note'},`TWOJE DODATKI: ${n}/4 • SZANSA W WALCE: ${str>=8?'PEWNA':Math.round(Math.min(11,str+1)/11*100)+'%'}`));
    const c=await buttonRow([{label:'UCIEKASZ'},{label:'PODDAJESZ SIĘ'},{label:'WALCZYSZ',cls:'red pri'}]);
    if(c===0)return await escapeHit(135);
    if(c===1){await robbed();return null}
    page();card('WALKA TRWA...',{img:135});
    for(let i=0;i<4;i++){SND.boom();vib(60);$('scene').classList.toggle('alert');await sleep(260)}
    $('scene').className='alert';
    const r=INT(rnd()*11);
    if(r>str&&str<8){await say('PRZEGRAŁEŚ.',{title:'PORAŻKA',img:135,alert:true});await robbed();return null}
    damage(30-2*str);
    await say('WYGRAŁEŚ, ALE OKUPIŁEŚ TO STRATAMI. '+wreckText(),{title:'ZWYCIĘSTWO',img:135});
    if(S.cond<1)return 'wreck';
    let got=[];
    for(let i=1;i<=10;i++){const v=INT(rnd()*10);if(v*UNITS[i-1]<S.free){S.cargo[i]+=v;S.free-=UNITS[i-1]*v;if(v)got.push(v+' '+GOODS[i-1])}}
    hud();SND.win();
    await say('ZABIERASZ TOWARY ZE STATKU PIRATÓW'+(got.length?': '+got.join(', ')+'.':'. NIC CI SIĘ NIE ZMIEŚCIŁO.'),{title:'ŁUP',img:135});
    return null;
  }
};
async function robbed(){
  loseGoods(.8);S.cond=20;hud();
  await say('WSZYSTKO LEPSZE NIŻ PIRACI. OGRABIAJĄ CIĘ I ZOSTAWIAJĄ W ZNISZCZONYM STATKU.',{title:'OGRABIONY',img:135,alert:true});
}

/* ---------- RYNEK ---------- */
function level(i){ // cena względem typowej: tanio / średnio / drogo
  const lv=S.market[S.planet][i];return lv<=5?'c':lv>=11?'e':'m';
}
async function market(kind){
  const forest=kind==='forest';
  for(;;){
    hud();save();
    setScene(forest?'LEŚNICZÓWKA':'BIURO HANDLOWE',forest?[2,10]:[3,11],forest?'forest':'city');page();
    card(forest?'LEŚNICZY: TU KUPISZ WSZYSTKO. NIE PYTAMY SKĄD.':'KUPIEC: CZYM SŁUŻYĆ? TOWARY ZAKAZANE TYLKO W LESIE.',{img:forest?10:11});
    const g=h('div',{cls:'goods'});
    g.append(h('div',{cls:'ghd'},h('span',{},'TOWAR'),h('span',{},'KUP'),h('span',{},'SPR'),h('span',{},'MAM')));
    const pick=new Promise(res=>{
      for(let i=1;i<=10;i++){
        const off=!S.buy[i];
        const r=h('button',{cls:'row'+(off?' off':'')},
          h('span',{cls:'nm'},h('span',{},off?GOODS[i-1]:h('span',{},h('i',{cls:'lv '+level(i)}),GOODS[i-1])),h('small',{},'MIEJSCE '+UNITS[i-1])),
          h('span',{cls:'bp'},off?'---':S.buy[i]),h('span',{cls:'sp'},off?'---':S.sell[i]),h('span',{cls:'ow'},S.cargo[i]||''));
        r.onclick=()=>{SND.tap();res(i)};g.append(r);
      }
      main.append(g);
      main.append(h('div',{cls:'legend'},h('span',{},h('i',{cls:'lv c'}),'TANIO'),h('span',{},h('i',{cls:'lv m'}),'ŚREDNIO'),h('span',{},h('i',{cls:'lv e'}),'DROGO')));
      buttonRow([{label:forest?'WRÓĆ NA ORBITĘ':'WYJDŹ DO MIASTA',cls:'ghost',icon:'back'}]).then(()=>res(0));
    });
    const i=await pick;
    if(!i)return;
    await tradeSheet(i);
  }
}
async function tradeSheet(i){
  if(cargoTotal()===0)S.free=S.cap; // „NIC NIE MASZ” – oryginał zeruje wtedy ładownię
  if(!S.buy[i]){await say('CŚŚ. TUTAJ TYM NIE HANDLUJEMY.',{title:GOODS[i-1],alert:true});return}
  let mode=S.cargo[i]>0&&S.free<UNITS[i-1]?'sell':'buy';
  for(;;){
    const r=await openSheet((sh,close)=>{
      sheetHead(sh,{title:GOODS[i-1],sub:`KUPNO ${S.buy[i]} • SPRZEDAŻ ${S.sell[i]} • MIEJSCE ${UNITS[i-1]}/SZT • MASZ ${S.cargo[i]}`});
      const tb=h('div',{cls:'tabs'});
      ['KUPUJĘ','SPRZEDAJĘ'].forEach((l,k)=>{const b=h('button',{cls:(k===0)===(mode==='buy')?'on':''},l);b.onclick=()=>{SND.tap();close({tab:k?'sell':'buy'})};tb.append(b)});
      sh.append(tb);
      const isBuy=mode==='buy',price=isBuy?S.buy[i]:S.sell[i];
      let max;
      if(isBuy)max=Math.max(0,Math.min(INT(S.free/UNITS[i-1]),INT(S.money/price)));else max=S.cargo[i];
      const reason=isBuy?(S.money<price?'WON BIEDAKU – NIE STAĆ CIĘ NAWET NA 1 SZT.':S.free<UNITS[i-1]?'NIE ZMIEŚCISZ W ŁADOWNI.':''):(S.cargo[i]?'':'NIC NIE MASZ.');
      if(reason){sh.append(h('div',{cls:'body',style:'color:#ff8a8a'},reason));const b=h('button',{cls:'btn ghost'},'ZAMKNIJ');b.onclick=()=>close(null);sh.append(b);return}
      let q=isBuy?Math.min(max,1):max;
      const v=h('div',{cls:'v'}),minus=h('button',{},'-'),plus=h('button',{},'+');
      const rng=h('input',{type:'range',min:'0',max:String(max),step:'1'});
      const sum=h('div',{cls:'sum'});
      const ok=h('button',{cls:'btn pri'},isBuy?'KUP':'SPRZEDAJ');
      const upd=()=>{v.textContent=q;rng.value=q;ok.disabled=!q;
        sum.innerHTML=isBuy?`<span>KOSZT</span><b class="neg">-${q*price}</b><span>ZOSTANIE CI</span><b>${S.money-q*price}</b><span>WOLNE MIEJSCE PO</span><b>${S.free-q*UNITS[i-1]}</b>`
          :`<span>ZAROBISZ</span><b class="pos">+${q*price}</b><span>BĘDZIESZ MIAŁ</span><b>${S.money+q*price}</b><span>WOLNE MIEJSCE PO</span><b>${S.free+q*UNITS[i-1]}</b>`};
      const set=n=>{n=Math.max(0,Math.min(max,n|0));if(n!==q){q=n;SND.tap();upd()}};
      const rep=(btn,d)=>{let t,iv;const stop=()=>{clearTimeout(t);clearInterval(iv)};btn.addEventListener('pointerdown',e=>{e.preventDefault();set(q+d);t=setTimeout(()=>{iv=setInterval(()=>set(q+d*Math.max(1,Math.ceil(max/60))),70)},350)});['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop))};
      rep(minus,-1);rep(plus,1);rng.addEventListener('input',()=>{q=+rng.value;upd()});
      const qk=h('div',{cls:'quick'});[['0',0],['25%',.25],['50%',.5],['MAX',1]].forEach(([l,f])=>{const b=h('button',{},l);b.onclick=()=>set(Math.round(max*f));qk.append(b)});
      const cancel=h('button',{cls:'btn ghost'},'ZAMKNIJ');cancel.onclick=()=>close(null);
      ok.onclick=()=>{SND.coin();vib(15);close({q})};
      sh.append(h('div',{cls:'qty'},minus,v,plus),rng,qk,sum,h('div',{cls:'btns two'},cancel,ok));upd();
    });
    if(!r)return;
    if(r.tab){mode=r.tab;continue}
    const q=r.q;
    if(mode==='buy'){S.free-=UNITS[i-1]*q;S.money-=q*S.buy[i];S.cargo[i]+=q;hud();
      toast(`KUPIONO ${q} × ${GOODS[i-1]}`);if(S.free===0)await say('WYPEŁNIŁEŚ CAŁĄ ŁADOWNIĘ.',{title:'ŁADOWNIA PEŁNA'})}
    else{S.cargo[i]-=q;S.money+=S.sell[i]*q;S.free+=UNITS[i-1]*q;hud();toast(`SPRZEDANO ${q} × ${GOODS[i-1]}`)}
    return;
  }
}

/* ---------- MIASTO ---------- */
async function sCity(){
  if(S.place!==1){S.buy[10]=S.sell[10]=0;S.buy[9]=S.sell[9]=0;S.buy[7]=S.sell[7]=0}
  S.place=1;
  for(;;){
    S.scene='city';save();hud();
    setScene('MIASTO',[6,3,4],'city');page();
    main.append(h('div',{cls:'h'},'MIASTO NA PLANECIE '+PLANETS[S.planet-1][0]));
    const c=await tiles([
      {img:3,label:'BIURO HANDLOWE',sub:'KUPNO I SPRZEDAŻ'},
      {img:4,label:'TAWERNA',sub:S.tav>=3?'NIE WPUSZCZĄ CIĘ':'WSTĘP 15 • PLOTKI'},
      {img:136,label:'PORT KOSMICZNY',sub:'STATKI, DODATKI, REMONT'},
      {img:8,label:'NA ORBITĘ',sub:'WRÓĆ DO STATKU'}]);
    if(c===0)await market('city');
    else if(c===1)await sTavern();
    else if(c===2){const r=await sPort();if(r)return r}
    else return 'orbit';
  }
}
async function sTavern(){
  setScene('TAWERNA',[4,138],'city');page();
  if(S.tav===3){await say('WYNOCHA STĄD, BRZYDKI PASKUDZĄCY PIJAKU!',{title:'BRAMKARZ',img:138,alert:true});return}
  card('PRZY BARZE SIEDZI PIJAK. ZA KOLEJKĘ MOŻE COŚ POWIE...',{img:138});
  main.append(h('div',{cls:'note'},`WIZYTA ${S.tav+1}/3 PO TYM LOCIE. IM CZĘŚCIEJ PIJESZ, TYM MNIEJ PAMIĘTASZ.`));
  const c=await buttonRow([{label:'WEJDŹ I POSTAW (15)',cls:'pri',icon:'beer'},{label:'WYJDŹ',cls:'ghost',icon:'back'}]);
  if(c!==0)return;
  const v35=S.tav>0?4-2*S.tav:4;S.tav++;
  if(S.money<15){await wonBiedaku();return}
  S.money-=15;hud();SND.coin();
  page();card('ZA WJAZD PŁACISZ 15. PIJESZ...',{img:138});await sleep(700);
  if(rnd()*8>v35){await say('SPIŁEŚ SIĘ I NIE UZYSKAŁEŚ ŻADNYCH INFORMACJI.',{title:'KAC',img:138});return}
  const [item,val,text]=RUMORS[INT(rnd()*4)];
  let p;do{p=INT(rnd()*PCOUNT[S.ship])}while(p===S.planet);
  S.market[p][item]=val;
  await say(`PIJAK MÓWI, ŻE NA PLANECIE ${PLANETS[Math.max(0,p-1)][0]} ${text}`,{title:'PLOTKA',img:138,sub:'CENY '+GOODS[item-1]+' TAM SKOCZĄ'});
}

/* ---------- PORT ---------- */
async function sPort(){
  for(;;){
    hud();save();
    setScene('PORT KOSMICZNY',[136,SHIP_PIC()],'city');page();
    const c=await tiles([
      {img:131,label:'STOCZNIA',sub:'NOWY STATEK'},
      {icon:'wrench',color:'#7fd37a',label:'DODATKI',sub:[1,2,3,4].filter(owned).length+'/4 POSIADANE'},
      {img:137,label:'REMONT',sub:'KADŁUB '+S.cond+'% • '+S.repair+' ZA 1%'},
      {img:8,label:'ODLOT Z PLANETY',sub:'NA ORBITĘ'},
      {img:6,label:'DO MIASTA',wide:true,sub:'WRÓĆ NA ULICE'}]);
    if(c===0){const r=await sShips();if(r)return r}
    else if(c===1)await sUpgrades();
    else if(c===2)await sRepair();
    else if(c===3)return 'orbit';
    else return null;
  }
}
const SHIP_PIC=()=>S.shipNo<0?9:129+S.shipNo;
async function sShips(){
  setScene('STOCZNIA',[136,SHIP_PIC()],'city');page();
  main.append(h('div',{cls:'h'},'W TYM PORCIE • TWÓJ: '+S.shipName+' ('+S.cap+')'));
  return new Promise(res=>{
    for(let b=0;b<=S.shipsAvail;b++){
      const sh=SHIPS[b],cur=S.shipNo===b;
      const c=h('div',{cls:'card ship'},img(129+b,'',72),
        h('div',{},h('div',{cls:'nm'},h('span',{},sh[0]),cur?h('span',{cls:'tag'},'TWÓJ'):null),
          h('div',{cls:'st',html:`ŁADOWNOŚĆ <b>${sh[1]}</b><br>PALIWO <b>${(SHIP_IDX[b+1]+1)*5} NA PC</b> • ZASIĘG <b>${b===4?'X':b+1} UKŁ</b><br>KLASA <b>${sh[2]}</b>`})));
      const bt=h('button',{cls:'btn'+(S.money>=sh[3]&&!cur?' pri':'')},cur?'POSIADASZ':'KUP ZA '+sh[3]);
      if(cur)bt.disabled=true;
      bt.onclick=async()=>{
        SND.tap();
        if(S.money<sh[3]){await wonBiedaku();return}
        const k=await ask(`ŁADOWNOŚĆ ${sh[1]}. TOWAR PRZENIESIESZ NA NOWY STATEK.`,[{label:'KUPUJĘ ZA '+sh[3],cls:'pri'},{label:'JESZCZE NIE',cls:'ghost'}],{img:129+b,title:sh[0]});
        if(k!==0)return;
        const used=S.cap-S.free;S.cap=sh[1];S.free=S.cap-used;S.money-=sh[3];
        S.ship=SHIP_IDX[b+1];S.shipNo=b;S.shipName=sh[0];S.cond=100;hud();SND.win();
        await say('KUPIŁEŚ STATEK '+sh[0]+'.',{title:'GRATULACJE',img:129+b});
        res(S.cap>=3000?'finale':null);
      };
      c.append(bt);main.append(c);
    }
    buttonRow([{label:'WRÓĆ DO PORTU',cls:'ghost',icon:'back'}]).then(()=>res(null));
  });
}
async function sUpgrades(){
  for(;;){
    setScene('DODATKI',[136,SHIP_PIC()],'city');page();
    main.append(h('div',{cls:'h'},'WYPOSAŻENIE STATKU'));
    const pick=new Promise(res=>{
      UPGRADES.forEach(([n,d],k)=>{
        const has=owned(k+1),price=S.upg[k+1];
        const c=h('div',{cls:'card'},h('div',{cls:'ship',style:'grid-template-columns:1fr'},
          h('div',{},h('div',{cls:'nm'},h('span',{},n),has?h('span',{cls:'tag'},'MASZ'):null),h('div',{cls:'st'},d))));
        if(!has){const b=h('button',{cls:'btn'+(S.money>=price?' pri':''),style:'margin-top:10px'},'KUP ZA '+price);b.onclick=()=>{SND.tap();res(k+1)};c.append(b)}
        main.append(c);
      });
      buttonRow([{label:'WRÓĆ DO PORTU',cls:'ghost',icon:'back'}]).then(()=>res(0));
    });
    const k=await pick;if(!k)return;
    if(S.money<S.upg[k]){await wonBiedaku();continue}
    S.money-=S.upg[k];S.upg[k]=0;hud();SND.win();
    await say('KUPIŁEŚ '+UPGRADES[k-1][0]+'.',{title:'NOWY DODATEK'});
  }
}
async function sRepair(){
  if(S.cond>=100){await say('NIE MA CO REMONTOWAĆ.',{title:'REMONT',img:137});return}
  if(S.money<S.repair){await wonBiedaku();return}
  const max=Math.min(100-S.cond,INT(S.money/S.repair));
  const q=await qtySheet({title:'REMONT',ic:137,sub:`STATEK ZNISZCZONY W ${100-S.cond}%. CENA ${S.repair} ZA 1%.`,price:S.repair,max,mode:'repair',
    info:q=>`<span>KOSZT</span><b class="neg">-${q*S.repair}</b><span>KADŁUB PO</span><b>${S.cond+q}%</b><span>ZOSTANIE CI</span><b>${S.money-q*S.repair}</b>`});
  if(!q)return;
  S.cond+=q;S.money-=q*S.repair;hud();
  toast(`NAPRAWIŁEŚ STATEK DO ${S.cond}%`);
}

/* ---------- LAS ---------- */
async function sForest(){
  S.place=2;S.scene='forest';save();
  for(;;){
    hud();setScene('LAS',[7,2],'forest');page();
    main.append(h('div',{cls:'h'},'LAS NA PLANECIE '+PLANETS[S.planet-1][0]));
    const c=await tiles([{img:2,label:'LEŚNICZÓWKA',sub:'CZARNY RYNEK'},{img:8,label:'NA ORBITĘ',sub:'WRÓĆ DO STATKU'}]);
    if(c===1)return 'orbit';
    await market('forest');
  }
}

/* ---------- ZAKOŃCZENIA ---------- */
async function sFinale(){
  setScene('FINAŁ',[133],'');page();
  card('ZDOBYŁEŚ SPRZĘT. TERAZ WYBIERAJ, CO BĘDZIESZ ROBIŁ.',{img:133});
  const c=await buttonRow([{label:'ODBIĆ CÓRKĘ GUBERNATORA',cls:'red'},{label:'UCIEC DO INNEJ GALAKTYKI',cls:'pri'}]);
  return c===0?'caught':'victory';
}
async function sWreck(){await say('STATEK NIE DO UŻYTKU.',{title:'WRAK',alert:true});return 'caught'}
function endScreen(pics,title,text,btn){
  return new Promise(res=>{
    const e=$('endScr');e.innerHTML='';e.classList.remove('hide');
    const ims=h('div',{cls:'endimg'});const es=Math.min(innerWidth-36,460)/pics.length;pics.forEach(p=>ims.append(img(p,'',Math.min(es,200),true)));
    const b=h('button',{cls:'btn pri'},btn);b.onclick=()=>{SND.tap();e.classList.add('hide');res()};
    e.append(ims,h('div',{cls:'big'},title),h('div',{cls:'credit'},text),h('div',{cls:'btns'},b));
  });
}
async function sCaught(){
  dropSave();SND.no();
  await endScreen([12],'KONIEC PRZYGÓD','ZOSTAŁEŚ ZŁAPANY I UWIĘZIONY.','JESZCZE RAZ');
  S=null;return 'title';
}
async function sVictory(){
  dropSave();SND.win();
  await endScreen([13,14,15],'BRAWO, ZWYCIĘŻYŁEŚ!',`UCIEKŁEŚ DO INNEJ GALAKTYKI PO ${S.day} DNIACH PODRÓŻY.`,'ZAGRAJ PONOWNIE');
  S=null;return 'title';
}

/* ---------- TYTUŁ ---------- */
function sTitle(){
  return new Promise(res=>{
    const t=$('title');t.classList.remove('hide');
    const box=$('tbtns');box.innerHTML='';
    const sv=loadSave();
    const add=(label,cls,fn)=>{const b=h('button',{cls:'btn '+cls},label);b.onclick=()=>{ac();SND.ok();fn()};box.append(b)};
    if(sv)add('KONTYNUUJ • '+PLANETS[sv.planet-1][0]+' • '+sv.money,'pri',()=>{S=sv;lastMoney=null;t.classList.add('hide');res(S.scene||'orbit')});
    add(sv?'NOWA GRA':'START GRY',sv?'':'pri',()=>{S=newState();lastMoney=null;t.classList.add('hide');res('start')});
  });
}

    mk('JAK GRAĆ','',()=>{c.innerHTML='';c.append(h('div',{cls:'h'},'JAK GRAĆ'),h('div',{cls:'txt',style:'font-size:.85em;line-height:1.6'},
      'KUPUJ TANIO, SPRZEDAWAJ DROGO. KROPKA PRZY TOWARZE POKAZUJE CENĘ: ZIELONA TANIO, CZERWONA DROGO. ZAKAZANE TOWARY (NIEWOLNICY, BROŃ, NARKOTYKI) TYLKO W LEŚNICZÓWCE. PO WIZYCIE W MIEŚCIE NIE WEJDZIESZ DO LASU I ODWROTNIE, AŻ DO KOLEJNEGO LOTU. PIJAK W TAWERNIE ZDRADZA, GDZIE CENY SKOCZĄ. LEPSZY STATEK = WIĘKSZA ŁADOWNIA I DALSZE UKŁADY. KUP BŁYSK, BY ZAKOŃCZYĆ GRĘ.'),
      mk('OK','pri',close))}),
    mk('NOWA GRA','red',()=>{c.innerHTML='';c.append(h('div',{cls:'h'},'NOWA GRA?'),h('div',{cls:'txt'},'OBECNA GRA ZOSTANIE UTRACONA.'),
      mk('TAK, ZACZNIJ OD NOWA','red pri',()=>{dropSave();location.reload()}),mk('NIE','ghost',close))}),
    mk('WRÓĆ DO GRY','ghost',close));
  o.append(c);
};
$('ovm').onclick=e=>{if(e.target.id==='ovm')$('ovm').classList.add('hide')};
